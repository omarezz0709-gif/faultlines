name: Refresh data

# 00:00, 12:00 and 18:00 Berlin time. GitHub cron is UTC, so each slot has a
# summer and a winter trigger; the scripts skip whichever one is off-slot.
# Everything here is free: Google News RSS, Wikidata and the World Bank API.
on:
  schedule:
    - cron: "0 22,23 * * *"   # 00:00 Berlin
    - cron: "0 10,11 * * *"   # 12:00 Berlin
    - cron: "0 16,17 * * *"   # 18:00 Berlin
  workflow_dispatch:          # "Run workflow" button for a manual refresh

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Headlines (Google News)
        continue-on-error: true
        run: python scripts/news.py

      - name: AI update from the headlines (Gemini free tier)
        continue-on-error: true
        run: python scripts/ai_refresh.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

      - name: Leaders and parties (Wikidata, midnight only)
        continue-on-error: true
        run: python scripts/wikidata.py

      - name: Figures (World Bank, midnight only)
        continue-on-error: true
        run: python scripts/worldbank.py

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "faultlines-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh data $(date -u +%Y-%m-%dT%H:%MZ)"
            # someone may have pushed while this ran: replay the data commit on top and retry
            for attempt in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "push failed (attempt $attempt), retrying"
              sleep 10
            done
            exit 1
          fi

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
