name: Refresh from the news

# 00:00, 12:00 and 18:00 Berlin time. GitHub cron is UTC, so each slot has a
# summer and a winter trigger; refresh.py skips whichever one is off-slot.
on:
  schedule:
    - cron: "0 22,23 * * *"   # 00:00 Berlin
    - cron: "0 10,11 * * *"   # 12:00 Berlin
    - cron: "0 16,17 * * *"   # 18:00 Berlin
  workflow_dispatch:          # "Run workflow" button for a manual refresh

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: World Bank figures
        continue-on-error: true
        run: python scripts/worldbank.py

      - name: News refresh with Claude
        run: python scripts/refresh.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAULTLINES_MODEL: ${{ vars.FAULTLINES_MODEL }}

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "faultlines-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
