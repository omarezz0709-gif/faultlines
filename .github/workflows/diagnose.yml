name: Daily diagnostics

# 12:30 and 18:30 Berlin time (after the 12:00 and 18:00 data refresh). GitHub cron is UTC, so each slot has a
# summer and a winter trigger; the script skips whichever one is off-slot.
# Checks the live site, its data, the AI Worker, every news source and a real browser run (scripts/diagnose.py),
# saves the report to data/health.json (shown in the admin panel), re-runs a stale refresh or a broken Worker
# deploy by itself, and FAILS on real problems, so GitHub sends an email.
on:
  schedule:
    - cron: "30 10,11 * * *"   # 12:30 Berlin
    - cron: "30 16,17 * * *"   # 18:30 Berlin
  workflow_dispatch:           # "Run workflow" button for a check right now

permissions:
  contents: write              # save data/health.json
  actions: write               # re-run the refresh or the Worker deploy when they are the problem

concurrency:
  group: diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:   # only used to know whether the report email is set up
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Is it a check slot?
        id: slot
        run: python scripts/diagnose.py --slot

      - name: Browser for the site test (Chromium)
        if: steps.slot.outputs.run == 'true'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run the checks
        id: diag
        if: steps.slot.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/diagnose.py
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Save the report (admin panel → System check)
        if: steps.slot.outputs.run == 'true'
        run: |
          git config user.name "faultlines-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/health.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Diagnostics $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            echo "push failed (attempt $attempt), retrying"; sleep 10
          done
          exit 1

      # the report by email to any address: secrets REPORT_EMAIL (who gets it), MAIL_USERNAME + MAIL_PASSWORD
      # (the Gmail address that sends it and its Google "app password"). Without them this step is skipped.
      - name: Email the report
        if: steps.diag.outputs.email == 'true' && env.MAIL_USERNAME != '' && env.REPORT_EMAIL != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Faultlines diagnostics <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.REPORT_EMAIL }}
          subject: ${{ steps.diag.outputs.subject }}
          body: file://report-email.txt

      - name: Problems found → this run fails (red on GitHub)
        if: steps.diag.outcome == 'failure'
        run: |
          echo "::error::Diagnostics found problems. The report is in data/health.json and in the admin panel (System check)."
          exit 1
