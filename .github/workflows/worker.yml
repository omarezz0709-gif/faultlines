name: Deploy AI Worker

# Publishes worker/gemini-proxy.js to Cloudflare (Worker "faultlines-ai") whenever it changes.
# Needs one GitHub secret: CLOUDFLARE_API_TOKEN (Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers").
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:          # "Run workflow" button for a manual deploy

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Check the Cloudflare token is set
        id: token
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::warning::The CLOUDFLARE_API_TOKEN secret is not set yet, so the Worker was not deployed. Add it under Settings → Secrets and variables → Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Look up the KV namespace for the usage log
        if: steps.token.outputs.ok == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACCOUNT=$(grep '^account_id' worker/wrangler.toml | cut -d'"' -f2)
          ID=$(curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" \
                 "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/storage/kv/namespaces?per_page=100" \
               | python3 -c "import sys, json; d = json.load(sys.stdin); print(next((n['id'] for n in d.get('result', []) if n['title'] == 'faultlines-logs'), ''))")
          if [ -z "$ID" ]; then
            echo "::error::No KV namespace called faultlines-logs was found (or the token lacks KV permission)."
            exit 1
          fi
          sed -i "s/__KV_LOGS_ID__/$ID/" worker/wrangler.toml
          echo "Using KV namespace $ID"

      - name: Deploy to Cloudflare
        if: steps.token.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          command: deploy
